name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -q

      - name: Run tests
        run: mvn test -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -q

      - name: Package with sources and javadoc
        run: mvn package -DskipTests -q

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            synapse-core/target/synapse-core-*.jar
            synapse-core/target/synapse-core-*-sources.jar
            synapse-core/target/synapse-core-*-javadoc.jar
            synapse-http/target/synapse-http-*.jar
            synapse-http/target/synapse-http-*-sources.jar
            synapse-http/target/synapse-http-*-javadoc.jar
            synapse-config/target/synapse-config-*.jar
            synapse-config/target/synapse-config-*-sources.jar
            synapse-config/target/synapse-config-*-javadoc.jar
            synapse-interceptors/target/synapse-interceptors-*.jar
            synapse-metrics/target/synapse-metrics-*.jar
            synapse-all/target/synapse-all-*.jar
            synapse-spring-boot-starter/target/synapse-spring-boot-starter-*.jar
