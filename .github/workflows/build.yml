name: Build & Auto Tag

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -q

      - name: Run tests
        run: mvn test -q

      - name: Package
        run: mvn package -DskipTests -q

  auto-tag:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Initial version check
        id: initial
        run: |
          if [ "${{ steps.latest_tag.outputs.tag }}" = "v0.0.0" ]; then
            echo "is_initial=true" >> $GITHUB_OUTPUT
          else
            echo "is_initial=false" >> $GITHUB_OUTPUT
          fi

      - name: Increment version
        id: version
        run: |
          IS_INITIAL="${{ steps.initial.outputs.is_initial }}"
          
          if [ "$IS_INITIAL" = "true" ]; then
            NEW_VERSION="v1.0.0"
          else
            LATEST="${{ steps.latest_tag.outputs.tag }}"
            # Remove 'v' prefix
            VERSION="${LATEST#v}"
            # Split by dots
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            # Increment patch
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update README with latest version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.new_version }}"
          sed -i "s|<version> Tag</version>|<version>${VERSION}</version>|g" README.md
          sed -i "s|<version>TAG</version>|<version>${VERSION}</version>|g" README.md
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update version to ${VERSION} in README"
          git push

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Output version
        run: |
          echo "## 🚀 New Release" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.version.outputs.new_version }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "JitPack will build this automatically." >> $GITHUB_STEP_SUMMARY
          echo "Use: \`com.github.Abhiramrathod:synapse-all:${{ steps.version.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
