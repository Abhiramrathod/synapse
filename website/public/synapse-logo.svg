<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d6d3d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8a29e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d6d3d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78716c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e7e5e4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a8a29e;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- Icon -->
  <rect x="4" y="12" width="56" height="56" rx="14" fill="url(#iconGrad)"/>
  <circle cx="22" cy="32" r="3.5" fill="#e7e5e4" opacity="0.9"/>
  <circle cx="22" cy="48" r="3.5" fill="#d6d3d1" opacity="0.9"/>
  <circle cx="38" cy="32" r="3.5" fill="#e7e5e4" opacity="0.9"/>
  <circle cx="38" cy="48" r="3.5" fill="#d6d3d1" opacity="0.9"/>
  <circle cx="30" cy="28" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="30" cy="52" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="30" cy="40" r="4" fill="#fff"/>
  <line x1="25" y1="32" x2="27" y2="37" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
  <line x1="25" y1="48" x2="27" y2="43" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
  <line x1="35" y1="32" x2="33" y2="37" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
  <line x1="35" y1="48" x2="33" y2="43" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
  <line x1="33" y1="28" x2="35" y2="32" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <line x1="33" y1="52" x2="35" y2="48" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <line x1="27" y1="28" x2="25" y2="32" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <line x1="27" y1="52" x2="25" y2="48" stroke="#fff" stroke-width="1" opacity="0.3"/>
