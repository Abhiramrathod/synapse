<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4263eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4263eb" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Neural network nodes -->
    <circle cx="38" cy="42" r="6" fill="#00ff88" opacity="0.9"/>
    <circle cx="38" cy="86" r="6" fill="#00d4ff" opacity="0.9"/>
    <circle cx="64" cy="34" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="64" cy="64" r="7" fill="#ffffff"/>
    <circle cx="64" cy="94" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="90" cy="42" r="6" fill="#00ff88" opacity="0.9"/>
    <circle cx="90" cy="86" r="6" fill="#00d4ff" opacity="0.9"/>
    <!-- Connections -->
    <line x1="44" y1="42" x2="59" y2="37" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="44" y1="42" x2="57" y2="60" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="44" y1="86" x2="59" y2="90" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="44" y1="86" x2="57" y2="68" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="69" y1="37" x2="84" y2="42" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="69" y1="68" x2="84" y2="86" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="69" y1="60" x2="84" y2="42" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="69" y1="68" x2="84" y2="86" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="69" y1="90" x2="84" y2="86" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Synapse "S" letterform hint -->
  <text x="64" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="22" fill="url(#glow)" opacity="0.3">S</text>
</svg>
